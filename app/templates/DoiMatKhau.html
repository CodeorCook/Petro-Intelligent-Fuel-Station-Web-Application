{% extends "layouts/base.html" %}

{% block title %}Đổi mật khẩu - Petro{% endblock %}

{% block content %}
<main class="flex-grow flex items-center justify-center p-md md:p-xl py-xl relative">
  <div class="card-base shadow-lg border-outline-variant/30 w-full max-w-[480px] overflow-hidden flex flex-col">
    <!-- Header -->
    <div class="px-xl pt-xl pb-md border-b border-outline-variant/20">
      <h1 class="text-headline-md font-bold text-on-background">Đổi mật khẩu</h1>
      <p class="text-body-md text-secondary mt-sm">Vui lòng nhập mật khẩu hiện tại và mật khẩu mới của bạn.</p>
    </div>

    <!-- Form Body -->
    <form class="p-xl flex flex-col gap-lg flex-grow" id="passwordForm">
      <div class="flex flex-col gap-xs">
        <label class="text-label-md text-on-surface-variant font-medium" for="currentPassword">Mật khẩu hiện tại</label>
        <div class="relative">
          <input class="input-base pr-10" id="currentPassword" placeholder="Nhập mật khẩu hiện tại" type="password">
        </div>
      </div>

      <div class="flex flex-col gap-xs">
        <label class="text-label-md text-on-surface-variant font-medium" for="newPassword">Mật khẩu mới</label>
        <div class="relative">
          <input class="input-base pr-10" id="newPassword" placeholder="Nhập mật khẩu mới" type="password">
        </div>
      </div>

      <div class="flex flex-col gap-xs">
        <label class="text-label-md text-on-surface-variant font-medium" for="confirmPassword">Xác nhận mật khẩu mới</label>
        <div class="relative">
          <input class="input-base pr-10" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" type="password">
        </div>
      </div>
    </form>

    <!-- Footer Actions -->
    <div class="p-xl bg-surface-container-lowest border-t border-outline-variant/20 flex flex-col-reverse md:flex-row justify-end gap-md">
      <a href="/TaiKhoan.html" class="btn-secondary w-full md:w-auto text-center">Hủy</a>
      <button class="btn-primary w-full md:w-auto text-center" type="button">
        Cập nhật mật khẩu
      </button>
    </div>
  </div>
</main>
{% endblock %}
